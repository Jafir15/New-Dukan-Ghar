name: Build Android APKs

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android Apps
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java (v4)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      # ==== Build USER App ====
      - name: Build User Web App
        run: npm run build:user
        
      - name: Add Android Platform (if missing)
        run: npx cap add android || true

      - name: Generate Capacitor Assets
        run: npx @capacitor/assets generate --android

      # Custom config file copy kar ke sync karne ka sahi tareeqa
      - name: Sync Capacitor (User)
        run: |
          cp capacitor.user.config.ts capacitor.config.ts
          npx cap sync android

      - name: Build User APK
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Upload User APK
        uses: actions/upload-artifact@v4
        with:
          name: dukan-ghar-user-app
          path: ./android/app/build/outputs/apk/debug/app-debug.apk

      # ==== Build ADMIN App ====
      - name: Build Admin Web App
        run: npm run build:admin
        
      # Admin config file copy kar ke sync karne ka sahi tareeqa
      - name: Sync Capacitor (Admin)
        run: |
          cp capacitor.admin.config.ts capacitor.config.ts
          npx cap sync android

      - name: Build Admin APK
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: dukan-admin-app
          path: ./android/app/build/outputs/apk/debug/app-debug.apk
