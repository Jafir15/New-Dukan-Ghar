name: Build Android APKs

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android Apps
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      - name: Generate Capacitor Assets
        run: npx @capacitor/assets generate --android
        
      # ==== Build USER App ====
      - name: Build User Web App
        run: npm run build:user
        
      - name: Sync Capacitor (User)
        run: |
          npx cap add android || true
          npx cap sync android --config capacitor.user.config.ts

      - name: Build User APK
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Upload User APK
        uses: actions/upload-artifact@v4
        with:
          name: dukan-ghar-user-app
          path: ./android/app/build/outputs/apk/debug/app-debug.apk

      # ==== Build ADMIN App ====
      - name: Build Admin Web App
        run: npm run build:admin
        
      - name: Sync Capacitor (Admin)
        run: npx cap sync android --config capacitor.admin.config.ts

      - name: Build Admin APK
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: dukan-admin-app
          path: ./android/app/build/outputs/apk/debug/app-debug.apk
